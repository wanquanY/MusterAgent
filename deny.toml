[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0440", reason = "Testcontainers requires astral-tokio-tar for its archive helpers. It is confined to test tooling and tar-codec has a different API. Revisit when testcontainers removes it." },
  { id = "RUSTSEC-2026-0543", reason = "Croner and object_store use chrono types, as do kernel scheduling APIs. All releases are unmaintained. Moving to jiff or time requires migrating those interfaces." },
  { id = "RUSTSEC-2026-0555", reason = "Schedule evaluation and goal timezone validation use chrono-tz IANA zones with chrono and croner. All releases are unmaintained. Migrate with the scheduling stack to preserve DST behavior." },
  { id = "RUSTSEC-2026-0542", reason = "Object_store requires humantime for duration parsing and formatting. All releases are unmaintained. Revisit when the upstream dependency changes." },
  { id = "RUSTSEC-2026-0441", reason = "The model-provider adapter's AWS signing and event-stream dependencies pull in pin-utils through Smithy HTTP and types. Their first releases without it require Rust 1.94.1. Revisit when the workspace upgrades from Rust 1.92." },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
