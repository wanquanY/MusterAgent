serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
jsonschema = { version = "0.49.3", default-features = false }
sha2 = "0.11.0"
thiserror = "2.0.17"
toml = "0.9.10"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics", "trace"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
flate2 = "1.1.9"
fs4 = "1.1.0"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[patch.crates-io]
# SQLx 0.8.6 predates the upstream cancellation fix. Keep its API and backport
# the driver-owned fix; see vendor/sqlx-postgres/UPSTREAM.md for provenance.
sqlx-postgres = { path = "vendor/sqlx-postgres" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"

# Extension hooks require unwinding so panics become typed failures. Mobile
# scope/FFI owners also unwind and join cleanup rather than aborting the host.
[profile.mobile-release]
inherits = "release"
panic = "unwind"

# Unbounded incremental state was the largest source of worktree-local target
# growth. Dependency artifacts remain reusable; changed crates rebuild without
# retaining multi-gigabyte incremental graphs.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Desktop admission hashes large signed executables. Compile these stable byte
# primitives with optimization in the shared development profile; application
# code remains unoptimized and debuggable. Every desktop uses the same cache.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

# Gate builds are disposable proof artifacts, not a second developer cache. Keeping
# debug information and incremental state out of this profile bounds target growth.
[profile.gate]
inherits = "test"
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
