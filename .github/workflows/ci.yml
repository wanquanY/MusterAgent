name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  lint:
    name: Format, Clippy and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --offline -- -D warnings
      - run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  test:
    name: Workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MUSTERAGENT_DOCUMENT_PARSER_EXECUTABLE: ${{ github.workspace }}/target/debug/musteragent-document-parser
      RUST_TEST_THREADS: '1'
      MUSTERAGENT_TEST_OWNER: github-actions
      MUSTERAGENT_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fetch --locked
      # The hosted Linux runner provides Docker. Testkit starts its own labelled
      # database and object store containers and removes them after each test.
      - name: Prepare sandbox test image
        run: |
          docker pull python:3.12-slim
          python3 crates/infrastructure/sandbox-server/docker/build-test-image.py
      - run: cargo build --offline --workspace --bins
      - run: cargo test --offline --workspace --no-fail-fast

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  gate:
    name: CI required
    if: always()
    needs: [lint, test, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_RESULT: ${{ needs.test.result }}
      DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require successful checks
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_RESULT" = success
          else
            test "$DEPENDENCY_RESULT" = skipped
          fi
