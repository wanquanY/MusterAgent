name: Kernel checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      MUSTERAGENT_DOCUMENT_PARSER_EXECUTABLE: ${{ github.workspace }}/target/debug/musteragent-document-parser
      RUST_TEST_THREADS: 1
      MUSTERAGENT_TEST_OWNER: github-actions
      MUSTERAGENT_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --offline -- -D warnings
      - run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      # The hosted Linux runner provides Docker. Testkit starts its own labelled
      # database and object store containers and removes them after each test.
      - run: |
          docker pull python:3.12-slim
          python3 crates/infrastructure/sandbox-server/docker/build-test-image.py
      - run: cargo build --offline --workspace --bins
      - run: cargo test --offline --workspace --no-fail-fast
