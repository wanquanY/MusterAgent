name: Bug report / 缺陷报告
description: Report a reproducible problem in MusterAgent.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'For security vulnerabilities, use [private reporting](https://github.com/wanquanY/MusterAgent/security/advisories/new). Do not upload credentials or private data.'
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / 最小复现
      description: Commands, sanitized configuration, logs and the failing test if any.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Commit, OS/architecture, Rust version, PostgreSQL and object store versions.
    validations:
      required: true
