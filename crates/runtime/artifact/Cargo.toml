[package]
name = "musteragent-runtime-artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
musteragent-tool = { version = "0.1.0", path = "../../domains/tool" }
musteragent-projection.workspace = true
musteragent-artifact = { version = "0.1.0", path = "../../domains/artifact" }
musteragent-capability = { version = "0.1.0", path = "../../domains/capability" }
musteragent-content-ref = { version = "0.1.0", path = "../../foundation/content-ref" }
musteragent-event-envelope = { version = "0.1.0", path = "../../foundation/event-envelope" }
musteragent-identity = { version = "0.1.0", path = "../../foundation/identity" }
musteragent-ledger = { version = "0.1.0", path = "../ledger" }
musteragent-resource = { version = "0.1.0", path = "../../domains/resource" }
musteragent-run = { version = "0.1.0", path = "../run" }
musteragent-runtime-capability = { version = "0.1.0", path = "../capability" }
musteragent-runtime-content = { version = "0.1.0", path = "../content" }
musteragent-runtime-contract = { version = "0.1.0", path = "../../foundation/runtime-contract" }
musteragent-runtime-resource = { version = "0.1.0", path = "../resource" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
musteragent-activity = { version = "0.1.0", path = "../../domains/activity" }
