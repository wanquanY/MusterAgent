[package]
name = "musteragent-runtime-resource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
musteragent-content-ref.workspace = true
musteragent-artifact.workspace = true
musteragent-identity.workspace = true
musteragent-resource.workspace = true
musteragent-run.workspace = true
musteragent-runtime-capability.workspace = true
musteragent-runtime-contract.workspace = true
musteragent-runtime-content.workspace = true
lopdf = { version = "0.47.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt", "process", "io-util", "sync", "time"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["resource"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
