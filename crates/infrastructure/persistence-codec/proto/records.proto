    ContextCompactionStarted context_compaction_started = 39;
    ContextSnapshotCreated context_snapshot_created = 40;
    ContextCompactionFailed context_compaction_failed = 41;
    ArtifactCreated artifact_created = 42;
    ArtifactVersionCommitted artifact_version_committed = 43;
    ArtifactFailed artifact_failed = 44;
    ArtifactEditProposed artifact_edit_proposed = 45;
    UsageRecorded usage_recorded = 46;
    MessageRetracted message_retracted = 47;
    AttemptSuspended attempt_suspended = 48;
    ModelInvocationCancelled model_invocation_cancelled = 49;
