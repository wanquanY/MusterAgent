enum LedgerRecordKind {
  LEDGER_RECORD_KIND_UNSPECIFIED = 0;
  LEDGER_RECORD_KIND_DOMAIN_EVENT = 1;
  LEDGER_RECORD_KIND_OUTPUT_FRAME = 2;
}

enum OutputChannel {
  OUTPUT_CHANNEL_UNSPECIFIED = 0;
  OUTPUT_CHANNEL_ASSISTANT_TEXT = 1;
  OUTPUT_CHANNEL_REASONING_SUMMARY = 2;
  OUTPUT_CHANNEL_TOOL_ARGUMENTS = 3;
  OUTPUT_CHANNEL_TOOL_PROGRESS = 4;
  OUTPUT_CHANNEL_ARTIFACT_CONTENT = 5;
}

message OutputFrame {
  FrameId frame_id = 1;
  OutputId output_id = 2;
  MessageId message_id = 3;
  OutputChannel channel = 4;
  uint64 frame_index = 5;
  uint64 byte_offset_start = 6;
  uint64 byte_offset_end = 7;
  oneof content {
    string inline_utf8 = 8;
    ContentRef content_ref = 9;
  }
  Sha256 content_hash = 10;
  bool final_for_output = 11;
}
