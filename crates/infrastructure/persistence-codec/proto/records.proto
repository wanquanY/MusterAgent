    ConversationCreated conversation_created = 1;
    ConversationArchived conversation_archived = 2;
    ParticipantJoined participant_joined = 3;
    ParticipantLeft participant_left = 4;
    MessageAccepted message_accepted = 5;
    MessageCommitted message_committed = 6;
    MessagePartiallyCommitted message_partially_committed = 7;
    ActivityStarted activity_started = 8;
    ActivityCompleted activity_completed = 9;
    ActivityFailed activity_failed = 10;
    ActivityCancelled activity_cancelled = 11;
    RunAdmitted run_admitted = 12;
    RunStarted run_started = 13;
    RunWaiting run_waiting = 14;
    RunResumed run_resumed = 15;
    RunCancelRequested run_cancel_requested = 16;
    RunRetryScheduled run_retry_scheduled = 17;
    RunCompleted run_completed = 18;
    RunFailed run_failed = 19;
    RunCancelled run_cancelled = 20;
    RunInterrupted run_interrupted = 21;
    AttemptClaimed attempt_claimed = 22;
    AttemptSucceeded attempt_succeeded = 23;
    AttemptFailed attempt_failed = 24;
    AttemptAbandoned attempt_abandoned = 25;
    ModelInvocationStarted model_invocation_started = 26;
