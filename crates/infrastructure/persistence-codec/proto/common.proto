// Kernel persistence messages extracted from the original owner definitions.
syntax = "proto3";
package musteragent.v1;



message ActivityId { string value = 1; }

message Actor {
  TenantId tenant_id = 1;
  PrincipalId principal_id = 2;
  PrincipalKind principal_kind = 3;
}

message AgentId { string value = 1; }

enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;
  AGENT_KIND_SYSTEM_BUILTIN = 1;
  AGENT_KIND_CUSTOM = 2;
  AGENT_KIND_INSTALLED = 3;
}

enum AgentReleaseChannel {
  AGENT_RELEASE_CHANNEL_UNSPECIFIED = 0;
  AGENT_RELEASE_CHANNEL_STABLE = 1;
  AGENT_RELEASE_CHANNEL_CANARY = 2;
}

message AgentVersionId { string value = 1; }

message AgentVersionRef {
  AgentId agent_id = 1;
  AgentVersionId agent_version_id = 2;
  string agent_key = 3;
}

message ArtifactId { string value = 1; }

message ArtifactProposalId { string value = 1; }

message ArtifactVersionId { string value = 1; }

message AttachmentRef {
  ContentRef content_ref = 1;
  string display_name = 2;
}

message AttemptId { string value = 1; }

message BrowserJobId { string value = 1; }

message BrowserLeaseId { string value = 1; }

message BrowserSessionId { string value = 1; }

message CapabilityProviderId { string value = 1; }

message CloudHome {}

message CommandId { string value = 1; }

message ContentId { string value = 1; }

message ContentRef {
  ContentId content_id = 1;
  string media_type = 2;
  uint64 byte_length = 3;
  Sha256 sha256 = 4;
}

message ContextBranchId { string value = 1; }

message ContextSnapshotId { string value = 1; }

message ConversationId { string value = 1; }

message CorrelationId { string value = 1; }

message DelegationGroupId { string value = 1; }

message DelegationId { string value = 1; }

message DeviceHome {
  DeviceId device_id = 1;
}

message DeviceId { string value = 1; }

message DeviceInstallationId { string value = 1; }

message DevicePrivateScope {
  DeviceId device_id = 1;
  WorkspaceId workspace_id = 2;
}

message DreamJobId { string value = 1; }

message ErasureJobId { string value = 1; }

message ErasureReceiptId { string value = 1; }

enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  ERROR_CATEGORY_VALIDATION = 1;
  ERROR_CATEGORY_AUTHENTICATION = 2;
  ERROR_CATEGORY_AUTHORIZATION = 3;
  ERROR_CATEGORY_CONFLICT = 4;
  ERROR_CATEGORY_NOT_FOUND = 5;
  ERROR_CATEGORY_POLICY = 6;
  ERROR_CATEGORY_QUOTA = 7;
  ERROR_CATEGORY_DEPENDENCY = 8;
  ERROR_CATEGORY_TIMEOUT = 9;
  ERROR_CATEGORY_INTERNAL = 10;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_COMMAND = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_UNSUPPORTED_SCHEMA_VERSION = 3;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 4;
  ERROR_CODE_CONVERSATION_NOT_FOUND = 5;
  ERROR_CODE_CONVERSATION_ARCHIVED = 6;
  ERROR_CODE_CONVERSATION_EPOCH_STALE = 7;
  ERROR_CODE_CONVERSATION_SEQ_CONFLICT = 8;
  ERROR_CODE_PARTICIPANT_NOT_AUTHORIZED = 9;
  ERROR_CODE_AGENT_NOT_AVAILABLE = 10;
  ERROR_CODE_RUNTIME_SNAPSHOT_INVALID = 11;
  ERROR_CODE_MODEL_ROUTE_UNAVAILABLE = 12;
  ERROR_CODE_CAPABILITY_UNAVAILABLE = 13;
  ERROR_CODE_RUN_NOT_FOUND = 14;
  ERROR_CODE_RUN_TERMINAL = 15;
  ERROR_CODE_RUN_TRANSITION_INVALID = 16;
  ERROR_CODE_ATTEMPT_LEASE_STALE = 17;
  ERROR_CODE_INTERACTION_NOT_FOUND = 18;
  ERROR_CODE_INTERACTION_NOT_PENDING = 19;
  ERROR_CODE_INTERACTION_EXPIRED = 20;
  ERROR_CODE_INTERACTION_RESPONSE_INVALID = 21;
  ERROR_CODE_CONTENT_INTEGRITY_FAILED = 22;
  ERROR_CODE_CURSOR_EPOCH_STALE = 23;
  ERROR_CODE_CURSOR_COMPACTED = 24;
  ERROR_CODE_POLICY_DENIED = 25;
  ERROR_CODE_QUOTA_EXCEEDED = 26;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 27;
  ERROR_CODE_DEPENDENCY_TIMEOUT = 28;
  ERROR_CODE_INTERNAL_INVARIANT_VIOLATED = 29;
  ERROR_CODE_ARTIFACT_NOT_FOUND = 30;
  ERROR_CODE_CHANNEL_OBJECT_NOT_FOUND = 31;
  ERROR_CODE_CHANNEL_MUTATION_CONFLICT = 32;
  ERROR_CODE_CHANNEL_CREDENTIAL_UNAVAILABLE = 33;
  ERROR_CODE_MODEL_CONTEXT_EXCEEDED = 34;
  ERROR_CODE_TOOL_NOT_EXPOSED = 35;
  ERROR_CODE_RESOURCE_REVISION_CONFLICT = 36;
  ERROR_CODE_RESOURCE_NAME_CONFLICT = 37;
  ERROR_CODE_RESOURCE_MOVE_CYCLE = 38;
  ERROR_CODE_RESOURCE_NODE_NOT_FOUND = 39;
  ERROR_CODE_RESOURCE_PARENT_NOT_FOUND = 40;
  ERROR_CODE_RESOURCE_FILE_UNAVAILABLE = 41;
  // Rolling-upgrade compatibility only. Live keyset catalogs do not emit it.
  ERROR_CODE_CATALOG_CURSOR_INVALIDATED = 42;
  ERROR_CODE_MODEL_RESPONSE_INVALID = 43;
  ERROR_CODE_MODEL_REQUEST_REJECTED = 44;
  ERROR_CODE_CREDENTIAL_REFRESH_REQUIRED = 45;
  ERROR_CODE_CONTENT_UNAVAILABLE = 46;
  ERROR_CODE_CREDITS_EXHAUSTED = 47;
  ERROR_CODE_MODEL_NOT_ENTITLED = 48;
  // Upstream HTTP 402; distinct from first-party points and confirmed quota exhaustion.
  ERROR_CODE_MODEL_PAYMENT_REQUIRED = 49;
  ERROR_CODE_MEMORY_NOT_FOUND = 50;
  ERROR_CODE_MEMORY_CONFLICT = 51;
  ERROR_CODE_MEMORY_EVALUATION_PENDING = 52;
  ERROR_CODE_MEMORY_NOT_PUBLISHABLE = 53;
  ERROR_CODE_PUBLIC_DELIVERY_MISSING = 54;
  // The current device permission is narrower than this still-admitted Run.
  ERROR_CODE_NATIVE_PERMISSION_REDUCED = 55;
  // No browser execution provider is available for the routed work; retryable.
  ERROR_CODE_BROWSER_EXECUTION_UNAVAILABLE = 56;
}

message ErrorInfo {
  ErrorCode code = 1;
  ErrorCategory category = 2;
  string safe_message = 3;
  bool retryable = 4;
  optional string dependency_ref = 5;
  optional string diagnostic_ref = 6;
}

message ExecutionScope {
  oneof scope {
    TenantScope tenant = 1;
    WorkspaceScope workspace = 2;
    DevicePrivateScope device_private = 3;
    HostedAuthorityScope hosted_project = 4;
    // Grant authority only; ordinary client command scopes reject this variant.
    HostedProjectExecutionAuthorityScope hosted_project_execution = 5;
  }
}

message ExecutionWorkspaceId { string value = 1; }

message FrameId { string value = 1; }

message GoalId { string value = 1; }

message GoalPursuitId { string value = 1; }

message HostedAuthorityScope {
  ProjectId project_id = 1;
  WorkspaceId workspace_id = 2;
  TenantId resource_tenant_id = 3;
  PrincipalId owner_principal_id = 4;
  HostedHomeBinding home = 5;
}

message HostedHomeBinding {
  HostedHomeBindingId binding_id = 1;
  DeviceId device_id = 2;
  uint64 home_epoch = 3; // Nonzero; no transport-path meaning.
}

message HostedHomeBindingId { string value = 1; }

message HostedProjectExecutionAuthorityScope {
  HostedAuthorityScope scope = 1;
  Sha256 execution_assignment_digest = 2;
}

message InstinctId { string value = 1; }

message InterSessionMessageId { string value = 1; }

message InteractionId { string value = 1; }

message InvocationId { string value = 1; }

message LeaseId { string value = 1; }

message LedgerRecordId { string value = 1; }

message MemoryCollectionId { string value = 1; }

message MemoryId { string value = 1; }

message MemoryVersionId { string value = 1; }

message MemoryVersionRef {
  MemoryId memory_id = 1;
  MemoryVersionId memory_version_id = 2;
}

message MessageId { string value = 1; }

message ModelRouteRef {
  string route_key = 1;
}

message NoteAuthoringSessionId { string value = 1; }

message NoteSegmentId { string value = 1; }

message OutputId { string value = 1; }

message PageInstanceId { string value = 1; }

message ParticipantId { string value = 1; }

message PresentationDraftId { string value = 1; }

message PresentationTemplateRef {
  string template_id = 1;
  uint32 version = 2;
  string sha256 = 3;
}

message PrincipalId { string value = 1; }

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_USER = 1;
  PRINCIPAL_KIND_SERVICE = 2;
  PRINCIPAL_KIND_SYSTEM = 3;
}

message ProjectId { string value = 1; }

message ProjectTaskTarget {
  ProjectId project_id = 1;
  string work_item_id = 2;
  uint64 project_revision = 3;
  uint64 work_item_revision = 4;
  ConversationId controller_conversation_id = 5;
  uint64 controller_fencing_token = 6;
  optional uint64 assignment_epoch = 7;
}

message ResourceRef {
  oneof resource {
    ConversationId conversation_id = 1;
    MessageId message_id = 2;
    ActivityId activity_id = 3;
    RunId run_id = 4;
    InteractionId interaction_id = 5;
    ArtifactId artifact_id = 6;
    ContentRef content = 7;
    ContextSnapshotId context_snapshot_id = 8;
    ErasureJobId erasure_job_id = 9;
    ErasureReceiptId erasure_receipt_id = 10;
  }
}

message RunId { string value = 1; }

message RuntimeHome {
  oneof home {
    CloudHome cloud = 1;
    DeviceHome device = 2;
  }
}

message RuntimeSnapshotId { string value = 1; }

message SchemaRef {
  string schema_key = 1;
  Sha256 schema_hash = 2;
}

message Sha256 {
  bytes value = 1;
}

message SkillId { string value = 1; }

message SkillVersionId { string value = 1; }

message TenantId { string value = 1; }

message TenantScope {
  TenantId tenant_id = 1;
}

message ToolCallId { string value = 1; }

message ToolVersionRef {
  string key = 1;
}

message VersionedRef {
  string key = 1;
}

message WorkspaceId { string value = 1; }

message WorkspaceScope {
  WorkspaceId workspace_id = 1;
}
