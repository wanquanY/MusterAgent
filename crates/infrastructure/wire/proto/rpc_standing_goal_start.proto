// Kernel RPC contracts. Shared values are owned by persistence-codec.
syntax = "proto3";
package musteragent.v1;

import "common.proto";
import "rpc_runtime.proto";
import "runtime.proto";

message LookupStandingGoalStartReceiptRequest {

  SubmitMessageCommand submission = 1;
  StandingGoalStartIntent start = 2;
}

message LookupStandingGoalStartReceiptResponse {

  CommandAck receipt = 1;
}

message StandingGoalStartIntent {
  GoalId goal_id = 1;
  uint64 expected_goal_revision = 2;
  GoalPursuitId pursuit_id = 3;
}

service StandingGoalStartService {
  rpc Start(StartStandingGoalCommand) returns (CommandAck);
  rpc LookupReceipt(LookupStandingGoalStartReceiptRequest)
      returns (LookupStandingGoalStartReceiptResponse);
}

message StartStandingGoalCommand {
  SubmitMessageCommand submission = 1;
  StandingGoalStartIntent start = 2;
}
