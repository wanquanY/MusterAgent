// Kernel RPC contracts. Shared values are owned by persistence-codec.
syntax = "proto3";
package musteragent.v1;

message AgentJournalProviderError {
  AgentJournalProviderErrorKind kind = 1;
  AgentJournalProviderErrorCode safe_code = 2;
  bool retryable = 3;
  optional uint64 retry_after_ms = 4;
  optional string diagnostic_ref = 5;
}

enum AgentJournalProviderErrorCode {
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_UNSPECIFIED = 0;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_AUTHENTICATION_FAILED = 1;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_AUTHORIZATION_FAILED = 2;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_RATE_LIMITED = 3;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_INVALID_REQUEST = 4;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_PROVIDER_SERVER = 5;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_PROTOCOL_VIOLATION = 6;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_DEADLINE_EXCEEDED = 7;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_TRANSPORT_FAILED = 8;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CANCELLED = 9;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CREDENTIAL_RESOLUTION_FAILED = 10;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CONTENT_RESOLUTION_FAILED = 11;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_ROUTE_CONFIGURATION_INVALID = 12;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_QUOTA_EXCEEDED = 13;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CREDENTIAL_EXPIRED = 14;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CREDENTIAL_STORE_UNAVAILABLE = 15;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CONTENT_UNAVAILABLE = 16;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CONTENT_NOT_FOUND = 17;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_CONTENT_CAPACITY_EXCEEDED = 18;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_DEPENDENCY_STORE_UNAVAILABLE = 19;
  AGENT_JOURNAL_PROVIDER_ERROR_CODE_DEPENDENCY_STATE_INVALID = 20;

}

enum AgentJournalProviderErrorKind {
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_UNSPECIFIED = 0;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_AUTHENTICATION = 1;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_AUTHORIZATION = 2;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_RATE_LIMITED = 3;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_INVALID_REQUEST = 4;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_SERVER = 5;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_PROTOCOL = 6;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_TIMEOUT = 7;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_TRANSPORT = 8;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_CANCELLED = 9;
  AGENT_JOURNAL_PROVIDER_ERROR_KIND_QUOTA = 10;
}
