// Kernel RPC contracts. Shared values are owned by persistence-codec.
syntax = "proto3";
package musteragent.v1;

import "common.proto";
import "conversation_records.proto";
import "execution_grant.proto";
import "google/protobuf/timestamp.proto";
import "records.proto";
import "resource_records.proto";
import "rpc_common.proto";
import "rpc_conversation_records.proto";
import "rpc_file_query.proto";
import "rpc_records.proto";
import "rpc_resource_mutations.proto";
import "rpc_tool_records.proto";
import "rpc_workspace_control.proto";
import "run_records.proto";
import "runtime.proto";
import "snapshot.proto";
import "tool_records.proto";

message AbortFileEditCommand {
  CommandMetadata metadata = 1;
  ResourceEditSessionId session_id = 2;
  uint64 expected_session_revision = 3;
  WorkspaceFileEditCommandContext workspace_context = 4;
  
  bool execution_workspace = 5;
}

message AcknowledgeConversationSeenThroughRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
  uint64 expected_home_epoch = 3;
  uint64 seen_through = 4;
  google.protobuf.Timestamp rendered_at = 5;
}

message ActivateConversationContextBranchCommand {
  CommandMetadata metadata = 1;
  ContextBranchId branch_id = 2;
}

enum ActiveRunArchivePolicy {
  ACTIVE_RUN_ARCHIVE_POLICY_UNSPECIFIED = 0;
  ACTIVE_RUN_ARCHIVE_POLICY_REJECT = 1;
  ACTIVE_RUN_ARCHIVE_POLICY_CANCEL_THEN_ARCHIVE = 2;
}

message AdmissionSelection {
  AdmissionSurface surface = 1;
  repeated string requested_skill_refs = 2;
}

enum AdmissionSurface {
  ADMISSION_SURFACE_UNSPECIFIED = 0;
  ADMISSION_SURFACE_WEB = 1;
  ADMISSION_SURFACE_STUDIO = 2;
  ADMISSION_SURFACE_API = 3;
  ADMISSION_SURFACE_DESKTOP = 4;
  ADMISSION_SURFACE_CHANNEL = 5;
  
  ADMISSION_SURFACE_MOBILE = 6;
}

message ApplyFileEditsCommand {
  CommandMetadata metadata = 1;
  ResourceEditSessionId session_id = 2;
  ResourceEditOperationId operation_id = 3;
  uint64 expected_session_revision = 4;
  uint64 expected_sequence = 5;
  repeated TextEditOperation operations = 6;
  WorkspaceFileEditCommandContext workspace_context = 7;
  
  bool execution_workspace = 8;
}

message ArchiveConversationCommand {
  CommandMetadata metadata = 1;
  ActiveRunArchivePolicy active_run_policy = 2;
}

message ArtifactImportProvenance {
  string legacy_artifact_id = 1;
  string legacy_created_by_run_id = 2;
  string legacy_status = 3;
  string legacy_source_kind = 4;
  string legacy_source_id = 5;
  Sha256 source_payload_hash = 6;
}

enum ArtifactLifecycle {
  ARTIFACT_LIFECYCLE_UNSPECIFIED = 0;
  ARTIFACT_LIFECYCLE_DRAFT = 1;
  ARTIFACT_LIFECYCLE_PUBLISHED = 2;
  ARTIFACT_LIFECYCLE_ARCHIVED = 3;
  ARTIFACT_LIFECYCLE_FAILED = 4;
}

enum ArtifactOrigin {
  ARTIFACT_ORIGIN_UNSPECIFIED = 0;
  ARTIFACT_ORIGIN_RUNTIME = 1;
  ARTIFACT_ORIGIN_GOVERNED_IMPORT = 2;
  ARTIFACT_ORIGIN_PRODUCT = 3;
}

message ArtifactSummary {
  ArtifactId artifact_id = 1;
  ConversationId conversation_id = 2;
  ActivityId activity_id = 3;
  RunId created_by_run_id = 4;
  ArtifactKind kind = 5;
  ArtifactLifecycle lifecycle = 6;
  uint64 current_version = 7;
  string title = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  ArtifactVersionView current_version_view = 11;
  ArtifactOrigin origin = 12;
  ArtifactImportProvenance import_provenance = 13;
  
  WorkspaceId workspace_id = 14;
}

message ArtifactVersionView {
  ArtifactVersionId artifact_version_id = 1;
  ArtifactId artifact_id = 2;
  uint64 version = 3;
  ContentRef content_ref = 4;
  Sha256 content_hash = 5;
  InvocationId source_invocation_id = 6;
  ParticipantId committed_by = 7;
  google.protobuf.Timestamp committed_at = 8;
  repeated ContentRef dependency_refs = 9;
  
  PrincipalId committed_by_principal_id = 10;
}

message AttemptView {
  AttemptId attempt_id = 1;
  uint32 attempt_number = 2;
  string worker_id = 3;
  LeaseId lease_id = 4;
  uint64 fencing_token = 5;
  google.protobuf.Timestamp lease_expires_at = 6;
}

message BeginFileEditCommand {
  CommandMetadata metadata = 1;
  ResourceEditSessionId session_id = 2;
  ResourceNodeId file_node_id = 3;
  uint64 base_version = 4;
  string format_adapter = 5;
  google.protobuf.Timestamp expires_at = 6;
  WorkspaceFileEditCommandContext workspace_context = 7;
  
  bool execution_workspace = 8;
}

message CancelInteractionCommand {
  CommandMetadata metadata = 1;
  InteractionId interaction_id = 2;
  CancelReason reason = 3;
}

message CancelRunCommand {
  CommandMetadata metadata = 1;
  RunId run_id = 2;
  CancelReason reason = 3;
}

enum CatalogActionKind {
  CATALOG_ACTION_KIND_UNSPECIFIED = 0;
  CATALOG_ACTION_KIND_APPROVAL = 1;
  CATALOG_ACTION_KIND_CONFIRMATION = 2;
  CATALOG_ACTION_KIND_USER_INPUT = 3;
  CATALOG_ACTION_KIND_SELECTION = 4;
  CATALOG_ACTION_KIND_CREDENTIAL = 5;
  CATALOG_ACTION_KIND_OAUTH = 6;
  CATALOG_ACTION_KIND_BUDGET = 7;
  CATALOG_ACTION_KIND_RESOURCE = 8;
  CATALOG_ACTION_KIND_DEPENDENCY = 9;
}

enum CatalogAttentionKind {
  CATALOG_ATTENTION_KIND_UNSPECIFIED = 0;
  CATALOG_ATTENTION_KIND_CONVERSATION_CREATED = 1;
  CATALOG_ATTENTION_KIND_USER_MESSAGE = 2;
  CATALOG_ATTENTION_KIND_PROGRESS = 3;
  CATALOG_ATTENTION_KIND_OUTPUT = 4;
  CATALOG_ATTENTION_KIND_EXECUTION_OUTCOME = 5;
  CATALOG_ATTENTION_KIND_CHILD_REPORT = 6;
  CATALOG_ATTENTION_KIND_GOAL_EVALUATION = 7;
  CATALOG_ATTENTION_KIND_GOAL_DECISION = 8;
  CATALOG_ATTENTION_KIND_ACTION_REQUIRED = 9;
  CATALOG_ATTENTION_KIND_INBOUND_MESSAGE = 10;
  CATALOG_ATTENTION_KIND_ARTIFACT_OUTCOME = 11;
  CATALOG_ATTENTION_KIND_SYSTEM_NOTICE = 12;
}

message CatalogExecutionCounts {
  uint32 queued = 1;
  uint32 running = 2;
  uint32 waiting = 3;
  uint32 cancelling = 4;
}

enum CatalogExecutionOutcomeKind {
  CATALOG_EXECUTION_OUTCOME_KIND_UNSPECIFIED = 0;
  CATALOG_EXECUTION_OUTCOME_KIND_SUCCEEDED = 1;
  CATALOG_EXECUTION_OUTCOME_KIND_FAILED = 2;
  CATALOG_EXECUTION_OUTCOME_KIND_CANCELLED = 3;
  CATALOG_EXECUTION_OUTCOME_KIND_INTERRUPTED = 4;
}

enum CatalogGoalPursuitStatus {
  CATALOG_GOAL_PURSUIT_STATUS_UNSPECIFIED = 0;
  CATALOG_GOAL_PURSUIT_STATUS_PENDING = 1;
  CATALOG_GOAL_PURSUIT_STATUS_RUNNING = 2;
  CATALOG_GOAL_PURSUIT_STATUS_WAITING = 3;
  CATALOG_GOAL_PURSUIT_STATUS_PAUSED = 4;
  CATALOG_GOAL_PURSUIT_STATUS_ACHIEVED = 5;
  CATALOG_GOAL_PURSUIT_STATUS_FAILED = 6;
  CATALOG_GOAL_PURSUIT_STATUS_CANCELLED = 7;
}

enum CatalogRecoverability {
  CATALOG_RECOVERABILITY_UNSPECIFIED = 0;
  CATALOG_RECOVERABILITY_RETRYABLE = 1;
  CATALOG_RECOVERABILITY_USER_ACTION = 2;
  CATALOG_RECOVERABILITY_NON_RECOVERABLE = 3;
  CATALOG_RECOVERABILITY_UNKNOWN = 4;
}

enum CatalogStandingGoalStatus {
  CATALOG_STANDING_GOAL_STATUS_UNSPECIFIED = 0;
  CATALOG_STANDING_GOAL_STATUS_DRAFT = 1;
  CATALOG_STANDING_GOAL_STATUS_ACTIVE = 2;
  CATALOG_STANDING_GOAL_STATUS_PAUSED = 3;
  CATALOG_STANDING_GOAL_STATUS_ACHIEVED = 4;
  CATALOG_STANDING_GOAL_STATUS_FAILED = 5;
  CATALOG_STANDING_GOAL_STATUS_CANCELLED = 6;
}

enum CatalogWaitReason {
  CATALOG_WAIT_REASON_UNSPECIFIED = 0;
  CATALOG_WAIT_REASON_APPROVAL = 1;
  CATALOG_WAIT_REASON_USER_INPUT = 2;
  CATALOG_WAIT_REASON_CONFIRMATION = 3;
  CATALOG_WAIT_REASON_SELECTION = 4;
  CATALOG_WAIT_REASON_CREDENTIAL = 5;
  CATALOG_WAIT_REASON_OAUTH = 6;
  CATALOG_WAIT_REASON_BUDGET = 7;
  CATALOG_WAIT_REASON_DEVICE = 8;
  CATALOG_WAIT_REASON_RESOURCE = 9;
  CATALOG_WAIT_REASON_DEPENDENCY = 10;
  CATALOG_WAIT_REASON_EXTERNAL_OPERATION = 11;
  CATALOG_WAIT_REASON_RETRY_BACKOFF = 12;
  CATALOG_WAIT_REASON_DELEGATION = 13;
  CATALOG_WAIT_REASON_DELEGATION_GROUP = 14;
  CATALOG_WAIT_REASON_COMPLETIONS = 15;
}

message CommitResourceChangeSetCommand {
  CommandMetadata metadata = 1;
  ResourceChangeSetId change_set_id = 2;
  uint64 expected_revision = 3;
  repeated ResourceChangeSetMutation mutations = 4;
  
  bool execution_workspace = 5;
}

message CompleteContentUploadRequest {
  Actor actor = 1;
  string upload_id = 2;
  string media_type = 3;
  repeated ContentRef parts = 4;
  uint64 byte_length = 5;
  Sha256 sha256 = 6;
}

message ContentChunk {
  ContentRef content_ref = 1;
  uint64 byte_offset_start = 2;
  uint64 byte_offset_end = 3;
  bytes data = 4;
  bool final_chunk = 5;
}

message ContextBranchView {
  ContextBranchId branch_id = 1;
  optional ContextBranchId parent_branch_id = 2;
  LedgerRecordId fork_from_record_id = 3;
  uint64 fork_from_sequence = 4;
  optional ContentRef branch_summary_ref = 5;
  ContextBranchOrigin origin = 6;
  optional CorrelationId edit_group_id = 7;
  optional MessageId edit_target_message_id = 8;
  PrincipalId created_by = 9;
  uint64 created_sequence = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ConversationActionSummaryV2 {
  uint32 count = 1;
  optional CatalogActionKind highest_priority = 2;
  repeated CatalogActionKind kinds = 3;
}

message ConversationCatalogChange {
  optional ConversationId conversation_id = 1;
  bool resync_required = 2;
  ConversationSummary conversation = 3;
  bool removed = 4;
}

message ConversationCatalogChangeV2 {
  uint64 latest_position = 1;
  oneof change {
    ConversationCatalogSummaryV2 upsert = 2;
    ConversationId remove = 3;
    bool resync_required = 4;
  }
}

message ConversationCatalogCursorV2 {
  uint64 snapshot_position = 1;
  google.protobuf.Timestamp after_activity_at = 2;
  ConversationId after_conversation_id = 3;
}

message ConversationCatalogSummaryV2 {
  TenantId tenant_id = 1;
  ConversationId conversation_id = 2;
  optional WorkspaceId workspace_id = 3;
  ConversationKind kind = 4;
  optional string title = 5;
  ConversationLifecycle lifecycle = 6;
  RuntimeHome control_home = 7;
  uint64 home_epoch = 8;
  uint64 catalog_revision = 9;
  uint64 last_activity_position = 10;
  google.protobuf.Timestamp last_user_visible_activity_at = 11;
  google.protobuf.Timestamp metadata_updated_at = 12;
  ConversationExecutionSummaryV2 execution = 13;
  ConversationActionSummaryV2 action_required = 14;
  optional CatalogStandingGoalStatus standing_goal_status = 15;
  optional CatalogGoalPursuitStatus pursuit_status = 16;
  optional ConversationOutcomeSummaryV2 latest_outcome = 17;
  ConversationUnreadSummaryV2 unread = 18;
}

message ConversationExecutionSummaryV2 {
  CatalogExecutionCounts root = 1;
  CatalogExecutionCounts child = 2;
  CatalogExecutionCounts pursuit = 3;
  repeated CatalogWaitReason wait_reasons = 4;
}

message ConversationListCursor {
  google.protobuf.Timestamp updated_at = 1;
  ConversationId conversation_id = 2;
}

message ConversationOperationalSummary {
  uint32 active_run_count = 1;
  uint32 queued_run_count = 2;
  uint32 running_run_count = 3;
  uint32 waiting_run_count = 4;
  uint32 cancelling_run_count = 5;
  repeated RunWaitReason wait_reasons = 6;
  uint32 pending_interaction_count = 7;
  repeated InteractionKind pending_interaction_kinds = 8;
}

message ConversationOutcomeSummaryV2 {
  CatalogExecutionOutcomeKind kind = 1;
  optional string error_class = 2;
  optional CatalogRecoverability recoverability = 3;
}

message ConversationProjectionSnapshot {
  string schema_version = 1;
  ProjectionSnapshotId snapshot_id = 2;
  TenantId tenant_id = 3;
  ConversationId conversation_id = 4;
  uint64 home_epoch = 5;
  uint64 through_conversation_seq = 6;
  repeated ProjectedMessage messages = 7;
  repeated ProjectedToolItem tool_timeline = 8;
  repeated ProjectedInteraction pending_interactions = 9;
  repeated ProjectedRun active_runs = 10;
  repeated ProjectedArtifact artifacts = 11;
  repeated ContentRef content_manifest = 12;
  Sha256 checksum = 13;
  google.protobuf.Timestamp created_at = 14;
  repeated ProjectedStreamOutput stream_outputs = 15;
  repeated ProjectedActivity activities = 16;
  repeated ProjectedRun runs = 17;
  repeated ProjectedContextCompaction context_compactions = 18;
}

message ConversationProjectionWindowCursor {
  ProjectionSnapshotId snapshot_id = 1;
  Sha256 snapshot_checksum = 2;
  uint64 before_message_index = 3;
}

message ConversationReadReceiptAck {
  PrincipalId principal_id = 1;
  ConversationId conversation_id = 2;
  uint64 seen_through = 3;
  bool changed = 4;
}

message ConversationSummary {
  ConversationId conversation_id = 1;
  TenantId tenant_id = 2;
  optional WorkspaceId workspace_id = 3;
  ConversationKind kind = 4;
  string title = 5;
  ConversationLifecycle lifecycle = 6;
  LedgerCursor latest_cursor = 7;
  bool has_active_run = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  ConversationOperationalSummary operational = 11;
}

message ConversationUnreadSummaryV2 {
  uint32 count = 1;
  uint64 seen_through = 2;
  uint64 latest_visible_revision = 3;
  optional CatalogAttentionKind latest_unread_kind = 4;
  optional ConversationOutcomeSummaryV2 latest_unread_outcome = 5;
}

message ConversationView {
  ConversationId conversation_id = 1;
  TenantId tenant_id = 2;
  ConversationKind kind = 3;
  string title = 4;
  RuntimeHome control_home = 5;
  uint64 home_epoch = 6;
  uint64 next_conversation_seq = 7;
  ConversationLifecycle lifecycle = 8;
  PrincipalId created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp archived_at = 12;
  repeated ParticipantView participants = 13;
  optional WorkspaceId workspace_id = 14;
  ParticipantId execution_owner_participant_id = 15;
}

message CreateConversationCommand {
  CommandMetadata metadata = 1;
  ConversationId conversation_id = 2;
  ConversationKind kind = 3;
  string title = 4;
  RuntimeHome control_home = 5;
  optional WorkspaceId workspace_id = 6;
}

message CreateResourceFileCommand {
  CommandMetadata metadata = 1;
  ResourceChangeSetId change_set_id = 2;
  uint64 expected_revision = 3;
  ResourceNodeId node_id = 4;
  ResourceNodeId parent_node_id = 5;
  string name = 6;
  string sort_key = 7;
  ArtifactId artifact_id = 8;
  ArtifactVersionId artifact_version_id = 9;
  ContentRef content_ref = 10;
  ParticipantId participant_id = 11;
  WorkspaceResourceCommandContext workspace_context = 12;
  
  bool execution_workspace = 13;
}

message EditAndResubmitMessageCommand {
  reserved 15;
  CommandMetadata metadata = 1;
  MessageId target_message_id = 2;
  ContextBranchId preserved_branch_id = 3;
  ContextBranchId replacement_branch_id = 4;
  MessageId message_id = 5;
  ParticipantId participant_id = 6;
  oneof content {
    string text = 7;
    ContentRef content_ref = 8;
  }
  repeated AttachmentRef attachment_refs = 9;
  string requested_model_class = 10;
  RequestedFeatures requested_features = 11;
  ExecutionScope execution_scope = 12;
  SignedExecutionGrant signed_execution_grant = 13;
  AdmissionSelection admission_selection = 14;
  optional ProjectTaskTarget project_task_target = 16;
}

message EditCheckpointResponse {
  ResourceEditSessionId session_id = 1;
  ResourceEditOperationId operation_id = 2;
  uint64 sequence = 3;
  uint64 session_revision = 4;
  uint64 next_sequence = 5;
  ContentRef checkpoint_ref = 6;
  bool duplicate = 7;
}

message EditTerminalResponse {
  ResourceEditSessionId session_id = 1;
  FileEditSessionState state = 2;
  uint64 session_revision = 3;
  ArtifactVersionId artifact_version_id = 4;
  optional uint64 file_version = 5;
  bool duplicate = 6;
}

message EnqueueRunControlCommand {
  CommandMetadata metadata = 1;
  RunId run_id = 2;
  MessageId message_id = 3;
  ParticipantId participant_id = 4;
  RunControlKind kind = 5;
  oneof content {
    string text = 6;
    ContentRef content_ref = 7;
  }
  repeated AttachmentRef attachment_refs = 8;
}

enum FileEditSessionState {
  FILE_EDIT_SESSION_STATE_UNSPECIFIED = 0;
  FILE_EDIT_SESSION_STATE_OPEN = 1;
  FILE_EDIT_SESSION_STATE_FINALIZING = 2;
  FILE_EDIT_SESSION_STATE_COMMITTED = 3;
  FILE_EDIT_SESSION_STATE_ABORTED = 4;
  FILE_EDIT_SESSION_STATE_CONFLICTED = 5;
  FILE_EDIT_SESSION_STATE_EXPIRED = 6;
}

message FileEditSessionView {
  ResourceEditSessionId session_id = 1;
  ResourceNodeId file_node_id = 2;
  ArtifactId file_artifact_id = 3;
  uint64 base_version = 4;
  FileEditSessionState state = 5;
  uint64 session_revision = 6;
  uint64 next_sequence = 7;
  ContentRef checkpoint_ref = 8;
  string format_adapter = 9;
  google.protobuf.Timestamp expires_at = 10;
  WorkspaceId project_id = 11;
  ConversationId conversation_scope_id = 12;
  ExecutionWorkspaceId execution_workspace_id = 13;
  AgentId owned_agent_id = 14;
}

message FinalizeFileEditCommand {
  CommandMetadata metadata = 1;
  ResourceEditSessionId session_id = 2;
  ArtifactVersionId artifact_version_id = 3;
  ParticipantId committed_by = 4;
  uint64 expected_session_revision = 5;
  WorkspaceFileEditCommandContext workspace_context = 6;
  
  bool execution_workspace = 7;
}

message ForkConversationContextCommand {
  CommandMetadata metadata = 1;
  ContextBranchId branch_id = 2;
  ContextBranchId parent_branch_id = 3;
  LedgerRecordId fork_from_record_id = 4;
  ContentRef branch_summary_ref = 5;
}

message GetArtifactRequest {
  Actor actor = 1;
  ArtifactId artifact_id = 2;
  
  WorkspaceId workspace_id = 3;
}

message GetArtifactResponse {
  ArtifactSummary artifact = 1;
  repeated ArtifactVersionView versions = 2;
}

message GetConversationProjectionRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
  ProjectionSnapshotId preferred_snapshot_id = 3;
}

message GetConversationProjectionResponse {
  ConversationProjectionSnapshot snapshot = 1;
  LedgerCursor snapshot_cursor = 2;
}

message GetConversationProjectionWindowRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
  uint32 limit = 3;
  ConversationProjectionWindowCursor before = 4;
}

message GetConversationProjectionWindowResponse {
  ConversationProjectionSnapshot projection = 1;
  ProjectionSnapshotId authority_snapshot_id = 2;
  LedgerCursor head_cursor = 3;
  ConversationProjectionWindowCursor older_cursor = 4;
  bool has_older = 5;
}

message GetConversationReadBootstrapRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
  uint32 limit = 3;
  ProjectionSnapshotId preferred_snapshot_id = 4;
}

message GetConversationReadBootstrapResponse {
  GetConversationResponse conversation = 1;
  GetConversationProjectionWindowResponse window = 2;
}

message GetConversationRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
}

message GetConversationResponse {
  ConversationView conversation = 1;
  LedgerCursor latest_cursor = 2;
  repeated ActivityId active_activity_ids = 3;
  repeated RunId active_run_ids = 4;
  optional ContextBranchId active_context_branch_id = 5;
  repeated ContextBranchView context_branches = 6;
}

message GetInteractionRequest {
  Actor actor = 1;
  InteractionId interaction_id = 2;
}

message GetInteractionResponse {
  InteractionView interaction = 1;

  InteractionControlContext local_control = 2;
}

message GetRunRequest {
  Actor actor = 1;
  RunId run_id = 2;
}

message GetRunResponse {
  RunView run = 1;
  LedgerCursor latest_cursor = 2;
  repeated InteractionId pending_interaction_ids = 3;
  AttemptView active_attempt = 4;
  RunRetryConfiguration retry_configuration = 5;
}

message InteractionControlContext {
  TenantId tenant_id = 1;
  ConversationId conversation_id = 2;
  uint64 home_epoch = 3;
  RuntimeHome control_home = 4;
  RuntimeHome execution_home = 5;
  bool control_open = 6;
}

enum InteractionResponseAuthority {
  INTERACTION_RESPONSE_AUTHORITY_UNSPECIFIED = 0;
  INTERACTION_RESPONSE_AUTHORITY_WEB_USER_INPUT = 1;
  INTERACTION_RESPONSE_AUTHORITY_DEVICE_USER_PRESENCE = 2;

  INTERACTION_RESPONSE_AUTHORITY_ACCOUNT_USER_INPUT = 3;
  // Authenticated host input: one-shot cloud approvals, never device presence.
  INTERACTION_RESPONSE_AUTHORITY_HOST_USER_INPUT = 5;
}

message ListConversationArtifactsRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
  uint32 limit = 3;
  ArtifactId before_artifact_id = 4;
  string search_query = 5;
  repeated ArtifactKind kinds = 6;
}

message ListConversationArtifactsResponse {
  repeated ArtifactSummary artifacts = 1;
  ArtifactId next_before_artifact_id = 2;
  bool has_more = 3;
}

message ListConversationCatalogV2Request {
  Actor actor = 1;
  optional ConversationId conversation_id = 2;
  optional WorkspaceId workspace_id = 3;
  ConversationLifecycle lifecycle = 4;
  uint32 page_size = 5;
  optional ConversationCatalogCursorV2 after = 6;
}

message ListConversationCatalogV2Response {
  uint64 snapshot_position = 1;
  repeated ConversationCatalogSummaryV2 conversations = 2;
  optional ConversationCatalogCursorV2 next_cursor = 3;
}

message ListConversationRecordsRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
  LedgerCursor cursor = 3;
  uint32 limit = 4;
}

message ListConversationRecordsResponse {
  repeated LedgerRecord records = 1;
  LedgerCursor next_cursor = 2;
  bool has_more = 3;
  LedgerCursor projection_checkpoint = 4;
}

message ListConversationsRequest {
  Actor actor = 1;
  optional WorkspaceId workspace_id = 2;
  optional ConversationLifecycle lifecycle = 3;
  uint32 page_size = 4;
  optional ConversationListCursor after = 5;
  optional ConversationId conversation_id = 6;
}

message ListConversationsResponse {
  repeated ConversationSummary conversations = 1;
  optional ConversationListCursor next_cursor = 2;
}

message ListResourceChildrenRequest {
  Actor actor = 1;
  ConversationId conversation_id = 2;
  ResourceNodeId parent_node_id = 3;
  bool include_trashed = 4;
  uint32 offset = 5;
  uint32 limit = 6;
  
  bool execution_workspace = 7;
}

message ListResourceChildrenResponse {
  WorkspaceId project_id = 1;
  ConversationId conversation_scope_id = 2;
  uint64 revision = 3;
  repeated ResourceNodeView nodes = 4;
  optional uint32 next_offset = 5;
  ExecutionWorkspaceId execution_workspace_id = 6;
  AgentId owned_agent_id = 7;
}

message ListWorkspaceCatalogActivityRequest {
  Actor actor = 1;
  repeated WorkspaceId workspace_ids = 2;

  repeated ConversationId excluded_conversation_ids = 3;
}

message ListWorkspaceCatalogActivityResponse {
  
  uint64 snapshot_position = 1;
  repeated WorkspaceCatalogActivity workspaces = 2;
}

message MutateResourceNodeCommand {
  CommandMetadata metadata = 1;
  ResourceChangeSetId change_set_id = 2;
  ResourceMutationKind operation = 3;
  uint64 expected_revision = 4;
  ResourceNodeId node_id = 5;
  ResourceNodeId parent_node_id = 6;
  string name = 7;
  string sort_key = 8;
  ArtifactId file_artifact_id = 9;
  
  bool execution_workspace = 10;
}

message MutateWorkspaceResourceNodeCommand {
  Actor owner = 1;
  WorkspaceId workspace_id = 2;
