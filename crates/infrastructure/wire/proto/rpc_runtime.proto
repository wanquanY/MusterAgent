service RuntimeContentService {
  rpc ReadContent(ReadContentRequest) returns (stream ContentChunk);
  rpc ReadUploadedContent(ReadUploadedContentRequest) returns (stream ContentChunk);
  rpc PutContent(stream PutContentChunk) returns (ContentRef);
  rpc PutContentPart(PutContentPartRequest) returns (ContentRef);
  rpc CompleteContentUpload(CompleteContentUploadRequest) returns (ContentRef);
}

service RuntimeService {
  rpc CreateConversation(CreateConversationCommand) returns (CommandAck);

  rpc RecoverConversationCreation(CreateConversationCommand) returns (CommandAck);
  rpc SubmitMessage(SubmitMessageCommand) returns (CommandAck);
  rpc RetractMessage(RetractMessageCommand) returns (CommandAck);
  rpc ForkConversationContext(ForkConversationContextCommand) returns (CommandAck);
  rpc ActivateConversationContextBranch(ActivateConversationContextBranchCommand) returns (CommandAck);
  rpc EditAndResubmitMessage(EditAndResubmitMessageCommand) returns (CommandAck);
  rpc RetryRun(RetryRunCommand) returns (CommandAck);
  rpc CancelRun(CancelRunCommand) returns (CommandAck);
  rpc ResumeRun(ResumeRunCommand) returns (CommandAck);
  rpc EnqueueRunControl(EnqueueRunControlCommand) returns (CommandAck);
  rpc RespondInteraction(RespondInteractionCommand) returns (CommandAck);
  rpc CancelInteraction(CancelInteractionCommand) returns (CommandAck);
  rpc SetConversationTitle(SetConversationTitleCommand) returns (CommandAck);
  rpc ArchiveConversation(ArchiveConversationCommand) returns (CommandAck);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListWorkspaceCatalogActivity(ListWorkspaceCatalogActivityRequest) returns (ListWorkspaceCatalogActivityResponse);
  rpc ListConversationCatalogV2(ListConversationCatalogV2Request) returns (ListConversationCatalogV2Response);
  rpc AcknowledgeConversationSeenThrough(AcknowledgeConversationSeenThroughRequest) returns (ConversationReadReceiptAck);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetInteraction(GetInteractionRequest) returns (GetInteractionResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc ListConversationArtifacts(ListConversationArtifactsRequest) returns (ListConversationArtifactsResponse);
  rpc QueryFiles(QueryFilesRequest) returns (QueryFilesResponse);
  rpc InspectFile(InspectFileRequest) returns (InspectFileResponse);
  rpc ReadFileQuery(ReadFileQueryRequest) returns (ReadFileQueryResponse);
  rpc OpenFileQuery(InspectFileRequest) returns (OpenFileQueryResponse);
  rpc ReadFileContent(ReadFileContentRequest) returns (stream ContentChunk);
  rpc ListWorkspaceResourceChildren(ListWorkspaceResourceChildrenRequest) returns (ListResourceChildrenResponse);
  rpc EnsureWorkspaceResourceRoot(EnsureWorkspaceResourceRootRequest) returns (WorkspaceResourceRootReceipt);
  rpc ListResourceChildren(ListResourceChildrenRequest) returns (ListResourceChildrenResponse);
  rpc MutateWorkspaceResourceNode(MutateWorkspaceResourceNodeCommand) returns (ResourceMutationResponse);
  rpc MutateResourceNode(MutateResourceNodeCommand) returns (ResourceMutationResponse);
  rpc CreateResourceFile(CreateResourceFileCommand) returns (ResourceMutationResponse);
  rpc CommitResourceChangeSet(CommitResourceChangeSetCommand) returns (ResourceChangeSetResponse);
  rpc BeginFileEdit(BeginFileEditCommand) returns (FileEditSessionView);
  rpc ResumeFileEdit(ResumeFileEditRequest) returns (FileEditSessionView);
  rpc ApplyFileEdits(ApplyFileEditsCommand) returns (EditCheckpointResponse);
  rpc FinalizeFileEdit(FinalizeFileEditCommand) returns (EditTerminalResponse);
  rpc AbortFileEdit(AbortFileEditCommand) returns (EditTerminalResponse);
  rpc GetConversationProjection(GetConversationProjectionRequest) returns (GetConversationProjectionResponse);
  rpc GetConversationProjectionWindow(GetConversationProjectionWindowRequest) returns (GetConversationProjectionWindowResponse);
  rpc GetConversationReadBootstrap(GetConversationReadBootstrapRequest) returns (GetConversationReadBootstrapResponse);
  rpc ListConversationRecords(ListConversationRecordsRequest) returns (ListConversationRecordsResponse);
  rpc SubscribeConversationRecords(SubscribeConversationRecordsRequest) returns (stream LedgerRecord);
  rpc SubscribeConversationCatalog(SubscribeConversationCatalogRequest) returns (stream ConversationCatalogChange);
  rpc SubscribeConversationCatalogV2(SubscribeConversationCatalogV2Request) returns (stream ConversationCatalogChangeV2);
}

