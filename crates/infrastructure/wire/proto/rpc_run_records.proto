// Kernel RPC contracts. Shared values are owned by persistence-codec.
syntax = "proto3";
package musteragent.v1;

import "common.proto";
import "run_records.proto";

message MeteringUsageFact {
  TenantId tenant_id = 1;
  ConversationId conversation_id = 2;
  RunId run_id = 3;
  AttemptId attempt_id = 4;
  InvocationId invocation_id = 5;
  ModelInvocationPurpose purpose = 6;
  ModelRouteRef model_route_ref = 7;
  string requested_model_key = 8;
  string pricing_version_ref = 9;
  uint64 input_tokens_uncached = 10;
  uint64 output_tokens = 11;
  uint64 reasoning_tokens = 12;
  uint64 provider_cache_read_tokens = 13;
  uint64 provider_cache_write_tokens = 14;
  optional uint64 total_tokens = 15;
  string metering_dedup_key = 16;
  int64 observed_at_ms = 17;
  string credential_grant_ref = 18;
  string response_model_key = 19;
  uint64 provider_cache_write_1h_tokens = 20;
  bool cancelled = 21;
  optional string parent_run_id = 22;
  optional string billing_subject = 23;
}
