// Kernel RPC contracts. Shared values are owned by persistence-codec.
syntax = "proto3";
package musteragent.v1;

import "common.proto";
import "rpc_agent_model_usage.proto";
import "rpc_agent_provider_error.proto";

message AgentJournalArtifactFrame {
  OutputId output_id = 1;
  uint64 frame_index = 2;
  uint64 byte_offset_start = 3;
  string content = 4;
  bool final_for_output = 5;
}

message AgentJournalJson { bytes canonical_json = 1; }

message AgentJournalModelEvents {
  InvocationId invocation_id = 1;
  uint32 iteration = 2;
  uint32 batch_index = 3;
  repeated AgentJournalModelStreamEvent events = 4;
}

message AgentJournalModelStreamEvent {
  oneof event {
    AgentJournalResponseStarted response_started = 1;
    AgentJournalTextDelta text_delta = 2;
    AgentJournalTextDelta reasoning_delta = 3;
    AgentJournalTextDelta reasoning_summary_delta = 4;
    AgentJournalProviderReasoning provider_reasoning_replay = 5;
    AgentJournalToolStarted tool_call_started = 6;
    AgentJournalToolDelta tool_call_arguments_delta = 7;
    AgentJournalArtifactFrame artifact_content_frame = 8;
    AgentJournalToolCompleted tool_call_completed = 9;
    AgentJournalModelUsage usage = 10;
    ContentRef native_compaction_item = 11;
    AgentJournalStopReason response_completed = 12;
    AgentJournalProviderError response_error = 13;
    AgentJournalToolUnexposed tool_call_unexposed = 14;
    AgentJournalToolRejected tool_call_rejected = 15;
  }
}

message AgentJournalProviderReasoning {
  uint32 output_index = 1;
  string source_api_format = 2;
  string source_model_key = 3;
  AgentJournalJson payload = 4;
}

message AgentJournalResponseStarted { string response_ref = 1; string response_model_key = 2; }

enum AgentJournalStopReason {
  AGENT_JOURNAL_STOP_REASON_UNSPECIFIED = 0;
  AGENT_JOURNAL_STOP_REASON_STOP = 1;
  AGENT_JOURNAL_STOP_REASON_TOOL_CALLS = 2;
  AGENT_JOURNAL_STOP_REASON_MAX_OUTPUT_TOKENS = 3;
  AGENT_JOURNAL_STOP_REASON_CONTENT_FILTER = 4;
  AGENT_JOURNAL_STOP_REASON_CANCELLED = 5;
  AGENT_JOURNAL_STOP_REASON_CONTEXT_WINDOW_EXCEEDED = 6;
  
  AGENT_JOURNAL_STOP_REASON_TOKEN_LIMIT = 7;
}

message AgentJournalTextDelta { uint32 output_index = 1; string delta = 2; }

message AgentJournalToolCompleted { uint32 output_index = 1; ToolCallId call_id = 2; AgentJournalJson arguments = 3; }

message AgentJournalToolDelta { uint32 output_index = 1; ToolCallId call_id = 2; string delta = 3; }

message AgentJournalToolRejected {
  uint32 output_index = 1;
  ToolCallId call_id = 2;
  
  string kind = 3;
  optional bytes argument_diagnostic_v1 = 4;
}

message AgentJournalToolReplay {
  ModelRouteRef source_route_ref = 1;
  string source_api_format = 2;
  string source_model_key = 3;
  oneof payload { string google_thought_signature = 4; }
}

message AgentJournalToolStarted {
  uint32 output_index = 1;
  ToolCallId call_id = 2;
  string wire_name = 3;
  optional string provider_item_ref = 4;
  AgentJournalToolReplay provider_replay = 5;
}

message AgentJournalToolUnexposed { string name = 1; }
