[package]
name = "musteragent-sandbox-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Server-side code sandbox provider: runs Browser Job protocol jobs in isolated Docker containers behind an egress proxy."

[dependencies]
musteragent-capability.workspace = true
musteragent-content-ref.workspace = true
musteragent-identity.workspace = true
musteragent-runtime-capability.workspace = true
musteragent-runtime-content.workspace = true
musteragent-runtime-contract.workspace = true
musteragent-sandbox.workspace = true
musteragent-mcp-client.workspace = true
musteragent-runtime-resource.workspace = true
serde_json.workspace = true
tar = "0.4.46"
bollard = { version = "0.20.2", default-features = false, features = ["pipe"] }
bytes = "1.12.1"
futures-util = "0.3.33"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ipnet = "2.12.0"
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tracing.workspace = true

[dev-dependencies]
musteragent-persistence-codec.workspace = true
musteragent-mcp.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
