[package]
name = "musteragent-mcp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Cloud-side Model Context Protocol client: Streamable HTTP and stdio transports, untrusted tool output stored as ContentRefs."

[features]
# Exposes a local tokio::process launcher, an in-memory content store and
# static credentials. Test-only: production hosts supply their own ports.
test-support = ["tokio/process"]

[dependencies]
musteragent-content-ref.workspace = true
musteragent-identity.workspace = true
musteragent-mcp.workspace = true
musteragent-runtime-content.workspace = true
base64 = "0.22.1"
jsonschema.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
musteragent-mcp-client = { path = ".", features = ["test-support"] }
bytes = "1.12.1"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["net", "process", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
